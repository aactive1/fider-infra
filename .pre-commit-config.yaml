repos:
  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform formatting
        entry: terraform fmt -check -recursive
        language: system
        pass_filenames: false
        files: ^(bootstrap|platform)/.*\.tf$

      - id: tflint-bootstrap
        name: TFLint bootstrap
        entry: tflint --chdir=bootstrap
        language: system
        pass_filenames: false
        files: ^bootstrap/.*\.tf$

      - id: tflint-platform
        name: TFLint platform
        entry: tflint --chdir=platform
        language: system
        pass_filenames: false
        files: ^platform/.*\.tf$